# Release: push tagu vX.Y.Z → kontroly, testy, build a GitHub release se skriptem.
# Tampermonkey si novou verzi stáhne sám přes @updateURL / @downloadURL
# (…/releases/latest/download/…), viz scripts/meta.mjs.
name: Release

on:
  push:
    tags: ["v*"]
  # Ruční spuštění pro existující tag (Actions → Release → Run workflow).
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag k vydání, např. v2.5.0"
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Tag odpovídá verzi v package.json
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "v$v" != "$TAG" ]; then
            echo "::error::Tag $TAG neodpovídá verzi v package.json ($v)"
            exit 1
          fi

      - run: npm ci --no-audit --no-fund

      - name: Kontroly, testy a build (zmenšený)
        run: ./build.sh --minify

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          generate_release_notes: true
          files: |
            dist/mg-autoharvest.user.js
            dist/mg-autoharvest.meta.js
